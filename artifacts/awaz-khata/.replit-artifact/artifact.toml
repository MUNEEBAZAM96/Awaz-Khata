kind = "mobile"
previewPath = "/"
title = "Awaz Khata"
description = "A voice-first Urdu ledger (udhaar khata) mobile app for Pakistani shopkeepers. Users record customer credit and payments entirely by speaking in Urdu, ask for a customer's balance by voice, and hear the answer spoken back. Includes a full ledger view of all customers and their running balances."
version = "1.0.0"
id = "artifacts/awaz-khata"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23443

[services.development]
run = "pnpm --filter @workspace/awaz-khata run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/awaz-khata", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/awaz-khata", "run", "serve" ]

[services.env]
PORT = "23443"
BASE_PATH = "/"
